<svg width="700" height="500" viewBox="0 0 700 500" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#EEF5FF"></stop>
<stop offset="100%" stop-color="#FFFFFF"></stop>
</linearGradient>

<linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#1E40AF"></stop>
<stop offset="100%" stop-color="#0A2342"></stop>
</linearGradient>

<filter id="shadow">
<feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".2"></feDropShadow>
</filter>

</defs>

<!-- Background -->

<rect width="700" height="500" rx="30" fill="url(#bg)"></rect>

<!-- Decorative circles -->

<circle cx="620" cy="90" r="70" fill="#2563EB" opacity=".08"></circle>

<circle cx="80" cy="430" r="60" fill="#2563EB" opacity=".06"></circle>

<!-- Laptop -->

<g filter="url(#shadow)">

<rect x="205" y="250" width="290" height="160" rx="10" fill="#23395D"></rect>

<rect x="220" y="265" width="260" height="120" rx="5" fill="#0B1220"></rect>

<rect x="180" y="410" width="340" height="15" rx="7" fill="#C9D3E6"></rect>

</g>

<!-- Code -->

<text x="235" y="300" font-size="18" font-family="Consolas" fill="#00E676">

&lt;html&gt;

</text>

<text x="235" y="325" font-size="18" font-family="Consolas" fill="#FFD54F">

&lt;body&gt;

</text>

<text x="255" y="350" font-size="18" font-family="Consolas" fill="#64B5F6">

Hello World

</text>

<text x="235" y="375" font-size="18" font-family="Consolas" fill="#EF5350">

&lt;/body&gt;

</text>

<!-- Head -->

<circle cx="520" cy="165" r="45" fill="#D8A47F"></circle>

<!-- Hair -->

<path d="M478 160
C490 105 560 105 565 165
C555 135 500 130 478 160" fill="#111827"></path>

<!-- Body -->

<path d="M470 215
Q520 185 570 215
L590 320
L450 320
Z" fill="url(#shirt)"></path>

<!-- Left Arm -->

<rect x="438" y="235" width="30" height="90" rx="15" fill="#D8A47F"></rect>

<!-- Right Arm -->

<rect x="572" y="235" width="30" height="90" rx="15" fill="#D8A47F"></rect>

<!-- Coffee -->

<rect x="585" y="350" width="45" height="55" rx="8" fill="#263238"></rect>

<rect x="628" y="362" width="10" height="28" rx="5" stroke="#263238" stroke-width="4" fill="none"></rect>

<!-- Floating HTML -->

<rect x="90" y="130" width="80" height="90" rx="12" fill="white" filter="url(#shadow)"></rect>

<text x="110" y="185" font-size="42" font-weight="bold" fill="#E34F26">

5

</text>

<text x="98" y="155" font-size="20" font-family="Arial" fill="#E34F26">

HTML

</text>

<!-- CSS -->

<rect x="110" y="260" width="80" height="90" rx="12" fill="white" filter="url(#shadow)"></rect>

<text x="132" y="315" font-size="42" font-weight="bold" fill="#1572B6">

3

</text>

<text x="122" y="285" font-size="20" fill="#1572B6">

CSS

</text>

<!-- JS -->

<rect x="600" y="240" width="70" height="70" rx="10" fill="#F7DF1E"></rect>

<text x="618" y="285" font-size="28" font-weight="bold" fill="#000">

JS

</text>

<!-- Bootstrap -->

<rect x="610" y="145" width="60" height="60" rx="10" fill="#6F42C1"></rect>

<text x="626" y="184" font-size="32" font-weight="bold" fill="white">

B

</text>

</svg>