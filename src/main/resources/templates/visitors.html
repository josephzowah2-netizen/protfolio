<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visitors</title>
  <link
    th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css}"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">
</head>
<body class="container-fluid">
  <h1 class="text-danger text-center my-4">Visitors</h1>

  <div class="table-responsive">
    <table class="table table-bordered border-danger">
      <thead class="table-light">
        <tr>
          <th>Visitor Id</th>
          <th>Visitor Name</th>
          <th>Visitor Email</th>
          <th>Visitor Message</th>
          
        </tr>
      </thead>
      <tbody>
        <tr th:each="visitor: ${data}">
          <td th:text="${visitor.id}"></td> 
          <td th:text="${visitor.name}"></td>
          <td th:text="${visitor.email}"></td>
          <td th:text="${visitor.message}"></td>
         
        </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex flex-column flex-md-row justify-content-center gap-3 my-4">
   
    <a href="/" class="btn btn-secondary">Home Page</a>
  </div>

  <script
    th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js}"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>
</html>
