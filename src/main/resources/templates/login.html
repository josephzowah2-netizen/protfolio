
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Joseph M. Zowah</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        /* =====================================================
           PORTFOLIO THEME COLORS
        ===================================================== */
        :root {
            --navy: #0B1120;
            --navy-light: #101B2D;
            --navy-card: #142238;
            --navy-hover: #1B2B45;
            --gold: #D4AF37;
            --gold-light: #E8C75A;
            --white: #FFFFFF;
            --text-light: #D5DCE7;
            --text-muted: #9AA9BF;
            --border-color: rgba(212, 175, 55, 0.25);
        }

        /* =====================================================
           BODY
        ===================================================== */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left,
                    rgba(212, 175, 55, 0.08),
                    transparent 35%),
                radial-gradient(circle at bottom right,
                    rgba(37, 99, 235, 0.10),
                    transparent 35%),
                var(--navy);
            color: var(--white);
        }

        /* =====================================================
           BACKGROUND DECORATION
        ===================================================== */
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            position: relative;
            overflow: hidden;
        }

        .background-circle {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.08);
            pointer-events: none;
        }

        .circle-one {
            width: 350px;
            height: 350px;
            top: -150px;
            right: -100px;
        }

        .circle-two {
            width: 250px;
            height: 250px;
            bottom: -100px;
            left: -80px;
        }

        /* =====================================================
           LOGIN CARD
        ===================================================== */
        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(16, 27, 45, 0.96);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            overflow: hidden;
            position: relative;
            z-index: 2;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
        }

        .login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(
                90deg,
                transparent,
                var(--gold),
                var(--gold-light),
                transparent
            );
        }

        .login-card-body {
            padding: 40px;
        }

        /* =====================================================
           BRAND
        ===================================================== */
        .brand-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            background: rgba(212, 175, 55, 0.10);
            border: 1px solid rgba(212, 175, 55, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .brand-icon i {
            font-size: 34px;
            color: var(--gold);
        }

        .brand-name {
            text-align: center;
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .brand-name span {
            color: var(--gold);
        }

        .brand-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        /* =====================================================
           LOGIN HEADING
        ===================================================== */
        .login-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-description {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .gold-divider {
            width: 55px;
            height: 3px;
            background: var(--gold);
            border-radius: 10px;
            margin: 15px auto 30px;
        }

        /* =====================================================
           FORM
        ===================================================== */
        .form-label {
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 9px;
        }

        .input-group-custom {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            z-index: 3;
            font-size: 1.05rem;
        }

        .form-control {
            background: #0B1120;
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 11px;
            padding: 13px 15px 13px 45px;
            min-height: 52px;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: #77869D;
        }

        .form-control:focus {
            background: #0B1120;
            color: var(--white);
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12);
        }

        /* =====================================================
           LOGIN BUTTON
        ===================================================== */
        .btn-login {
            width: 100%;
            border: none;
            border-radius: 11px;
            padding: 14px;
            margin-top: 10px;
            background: var(--gold);
            color: var(--navy);
            font-size: 1rem;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: var(--gold-light);
            color: var(--navy);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.20);
        }

        .btn-login i {
            margin-left: 8px;
        }

        /* =====================================================
           ERROR ALERT
        ===================================================== */
        .alert-danger {
            background: rgba(220, 53, 69, 0.12);
            color: #FFB4B8;
            border: 1px solid rgba(220, 53, 69, 0.35);
            border-radius: 10px;
        }

        .alert-danger .btn-close {
            filter: invert(1);
        }

        /* =====================================================
           FOOTER
        ===================================================== */
        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .login-footer .gold-text {
            color: var(--gold);
            font-weight: 600;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */
        @media (max-width: 576px) {
            .login-card-body {
                padding: 30px 23px;
            }

            .login-title {
                font-size: 1.55rem;
            }

            .brand-icon {
                width: 60px;
                height: 60px;
            }

            .brand-icon i {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="login-page">

        <!-- Background Decoration -->
        <div class="background-circle circle-one"></div>
        <div class="background-circle circle-two"></div>

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                    <div class="login-card">

                        <div class="login-card-body">

                            <!-- Brand -->
                            <div class="brand-icon">
                                <i class="bi bi-code-slash"></i>
                            </div>

                            <div class="brand-name">
                                JOSEPH M. <span>ZOWAH</span>
                            </div>

                            <div class="brand-subtitle">
                                Software Developer
                            </div>

                            <!-- Login Heading -->
                            <h1 class="login-title">Welcome Back</h1>

                            <p class="login-description">
                                Sign in to access your administrator account
                            </p>

                            <div class="gold-divider"></div>

                            <!-- Error Message (Original Thymeleaf Logic Preserved) -->
                            <div th:if="${error}"
                                 class="alert alert-danger alert-dismissible fade show py-2 small"
                                 role="alert">

                                <i class="bi bi-exclamation-circle me-2"></i>

                                <span th:text="${error}">
                                    Invalid credentials
                                </span>

                                <button type="button"
                                        class="btn-close btn-sm"
                                        data-bs-dismiss="alert"
                                        aria-label="Close">
                                </button>
                            </div>

                            <!-- Login Form (Original Logic Preserved) -->
                            <form th:action="@{/login}" method="post">

                                <!-- Username -->
                                <div class="mb-4">

                                    <label for="username" class="form-label">
                                        Username
                                    </label>

                                    <div class="input-group-custom">

                                        <i class="bi bi-person input-icon"></i>

                                        <input type="text"
                                               id="username"
                                               name="username"
                                               class="form-control"
                                               placeholder="Enter username"
                                               required
                                               autofocus>
                                    </div>
                                </div>

                                <!-- Password -->
                                <div class="mb-4">

                                    <label for="password" class="form-label">
                                        Password
                                    </label>

                                    <div class="input-group-custom">

                                        <i class="bi bi-lock input-icon"></i>

                                        <input type="password"
                                               id="password"
                                               name="password"
                                               class="form-control"
                                               placeholder="Enter password"
                                               required>
                                    </div>
                                </div>

                                <!-- Submit Button -->
                                <button type="submit" class="btn-login">
                                    Sign In
                                    <i class="bi bi-arrow-right"></i>
                                </button>

                            </form>

                            <!-- Footer -->
                            <div class="login-footer">
                                Secure administrator access
                                <br>
                                <span class="gold-text">
                                    &copy; Joseph M. Zowah
                                </span>
                            </div>

                        </div>
                    </div>

                </div>
            </div>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
